<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="智能宠物领养平台 · 宠物档案、领养状态与 AI 助手" />
    <meta name="theme-color" content="#0f2b24" />
    <meta name="color-scheme" content="light" />
    <title>领养登记处 · 智能宠物领养平台</title>

    <!-- 首屏骨架：内联在 HTML 里，JS 还没下载完时先给用户一个稳定的画面，
         避免出现白屏闪烁（产物的 JS 体积较大，这一步对"体感速度"影响明显）。 -->
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
      }
      body {
        background: #edefea;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
          "Microsoft YaHei", system-ui, sans-serif;
      }
      .boot {
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
      }
      .boot__mark {
        font-size: 19px;
        font-weight: 600;
        letter-spacing: 5px;
        color: #1d4b3f;
      }
      .boot__bar {
        width: 128px;
        height: 2px;
        background: #d7dbd5;
        border-radius: 2px;
        overflow: hidden;
      }
      .boot__bar span {
        display: block;
        width: 38%;
        height: 100%;
        background: #1d4b3f;
        animation: boot-slide 1.1s ease-in-out infinite;
      }
      @keyframes boot-slide {
        0% {
          transform: translateX(-110%);
        }
        100% {
          transform: translateX(280%);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .boot__bar span {
          animation: none;
          width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div class="boot">
        <div class="boot__mark">领养登记处</div>
        <div class="boot__bar"><span></span></div>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
